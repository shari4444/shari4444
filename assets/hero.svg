<svg width="1000" height="330" viewBox="0 0 1000 330"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>

  </defs>

  <!-- Main rectangle -->
  <rect
    x="5"
    y="5"
    width="990"
    height="320"
    rx="25"
    fill="url(#bg)"
    stroke="#30363d"
    stroke-width="2"
  />

  <!-- Animated border -->
  <rect
    x="5"
    y="5"
    width="990"
    height="320"
    rx="25"
    fill="none"
    stroke="url(#text)"
    stroke-width="2"
    stroke-dasharray="1000"
    stroke-dashoffset="1000"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="1000"
      to="0"
      dur="2s"
      fill="freeze"
    />
  </rect>

  <!-- Name -->
  <text
    x="500"
    y="75"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="32"
    font-weight="bold"
    fill="url(#text)"
    opacity="0"
  >
    Hi, I'm Sharvari Chaudhari

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="1.5s"
      dur="1s"
      fill="freeze"
    />
  </text>

  <!-- Description -->
  <text
    x="500"
    y="125"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="17"
    fill="#c9d1d9"
    opacity="0"
  >
    Second-year Software Engineering student

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="2.2s"
      dur="1s"
      fill="freeze"
    />
  </text>

  <text
    x="500"
    y="152"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="17"
    fill="#c9d1d9"
    opacity="0"
  >
    passionate about building technology that solves real-world problems.

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      begin="2.5s"
      dur="1s"
      fill="freeze"
    />
  </text>

  <!-- Divider -->
  <line
    x1="180"
    y1="185"
    x2="820"
    y2="185"
    stroke="#30363d"
  />

  <!-- Repository box -->
  <rect
    x="225"
    y="210"
    width="230"
    height="75"
    rx="15"
    fill="#161b22"
    stroke="#30363d"
  />

  <text
    x="340"
    y="240"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="15"
    fill="#8b949e"
  >
    REPOSITORIES
  </text>

  <text
    x="340"
    y="270"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="bold"
    fill="#58a6ff"
  >
    YOUR_REPO_COUNT
  </text>

  <!-- Commit box -->
  <rect
    x="545"
    y="210"
    width="230"
    height="75"
    rx="15"
    fill="#161b22"
    stroke="#30363d"
  />

  <text
    x="660"
    y="240"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="15"
    fill="#8b949e"
  >
    2026 COMMITS
  </text>

  <text
    x="660"
    y="270"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="bold"
    fill="#f778ba"
  >
    YOUR_COMMIT_COUNT
  </text>

</svg>
